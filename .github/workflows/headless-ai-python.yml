name: Headless AI guide Python quality

on:
  pull_request:
    paths:
      - "stacks/headless-macbook-pro-ai-guide/scripts/**/*.py"
      - "stacks/headless-macbook-pro-ai-guide/pyproject.toml"
      - ".github/workflows/headless-ai-python.yml"
  push:
    paths:
      - "stacks/headless-macbook-pro-ai-guide/scripts/**/*.py"
      - "stacks/headless-macbook-pro-ai-guide/pyproject.toml"
      - ".github/workflows/headless-ai-python.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.17.0
          args: check stacks/headless-macbook-pro-ai-guide/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q stacks/headless-macbook-pro-ai-guide/scripts
