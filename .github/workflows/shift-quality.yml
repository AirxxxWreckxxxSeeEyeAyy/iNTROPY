name: SHIFT quality gate

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "scripts/**"
      - "build/**"
      - "*.json"
      - "*.mjs"
      - "*.yaml"
      - ".github/workflows/shift-quality.yml"
  push:
    branches: [main, codex/shift-decision-support-b]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check local calculation APIs
        run: |
          pnpm dev > /tmp/shift-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl -fsS http://localhost:5173/ -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/shift-preview.log; exit 1; fi
          node scripts/check-api.mjs
