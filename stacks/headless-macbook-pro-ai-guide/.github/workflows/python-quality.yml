name: Python quality

on:
  pull_request:
    paths:
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  push:
    paths:
      - "scripts/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.17.0
          args: check scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q scripts
